name: Keep Alive
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://gptloadus-gxjx99vh.b4a.run/health)
          echo "health: $code"
          if [ "$code" != "200" ]; then
            echo "retry once"
            sleep 30
            curl -s -o /dev/null -w "retry: %{http_code}\n" --max-time 120 https://gptloadus-gxjx99vh.b4a.run/health || true
          fi
